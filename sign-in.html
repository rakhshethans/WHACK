<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eef0e9">
  <title>WorldHopper | Sign in</title>
  <link rel="stylesheet" href="./src/styles.css">
  <script type="module" src="./src/account.tsx"></script>
</head>
<body class="account-page">
  <div class="page-wave" aria-hidden="true">
    <svg viewBox="0 0 1440 900" preserveAspectRatio="none" focusable="false">
      <defs>
        <linearGradient id="page-wave-light" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
          <stop stop-color="#dbeafb"/>
          <stop offset=".62" stop-color="#c4e2fb"/>
          <stop offset="1" stop-color="#ecf6ff"/>
        </linearGradient>
        <linearGradient id="page-wave-mist" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
          <stop stop-color="#f7fbff"/>
          <stop offset="1" stop-color="#d4eaff"/>
        </linearGradient>
      </defs>
      <path class="page-wave-swell" d="M-90-90H1530V405C1290 520 1110 486 891 333S452 67 191 165-90 199-90 199Z" fill="url(#page-wave-light)"/>
      <path class="page-wave-foam" d="M-90 36C220-29 433 62 641 170S1109 421 1530 230V388C1162 518 906 336 701 246S259 27-90 153Z" fill="url(#page-wave-mist)" opacity=".76"/>
      <path class="page-wave-swell" d="M-90 624C232 459 436 639 713 709S1229 708 1530 554V990H-90Z" fill="url(#page-wave-light)" opacity=".72"/>
    </svg>
  </div>
  <header class="masthead">
    <a class="brand" href="./" aria-label="WorldHopper">
      <span class="masthead-icon map-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" focusable="false">
          <path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3zM9 3v15m6-12v15"/>
        </svg>
      </span>
      <span class="brand-wordmark">WORLDHOPPER</span>
    </a>
    <a href="./" class="account-home account-text-button">My world</a>
  </header>
  <main id="account-app" class="account-main">
    <noscript>Sign-in requires JavaScript. <a href="./">Back to WorldHopper</a></noscript>
  </main>
</body>
</html>
