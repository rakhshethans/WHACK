<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101f23">
  <title>WorldHopper | Your archipelago</title>
  <link rel="stylesheet" href="./src/styles.css">
  <script type="module" src="./src/app.mjs"></script>
</head>
<body>
  <header class="masthead">
    <a class="brand" href="./"><span aria-hidden="true">◈</span> WORLDHOPPER</a>
    <nav aria-label="Main navigation">
      <button id="world-tab" type="button" aria-pressed="true">My world</button>
      <button id="explore-tab" type="button" aria-pressed="false">Explore</button>
    </nav>
    <div class="edition">FIELD ATLAS <span> / </span> 001</div>
  </header>
  <main id="app"></main>
  <p class="sr-only" id="announcement" role="status"></p>
  <dialog id="onboarding" aria-labelledby="onboarding-title">
    <form id="island-form">
      <div class="dialog-top"><span class="eyebrow">EXPEDITION LOG / 01</span><button type="button" class="icon" id="close-dialog" aria-label="Close">×</button></div>
      <h2 id="onboarding-title">Chart a new island</h2>
      <label class="topic-label">What do you want to learn or achieve?
        <input name="topic" required autofocus maxlength="70" placeholder="e.g. Learn Spanish for travel">
      </label>
      <div class="form-row">
        <label>Experience<select name="experience"><option value="beginner">New to it</option><option value="intermediate">Some experience</option><option value="advanced">Confident</option></select></label>
        <label>Time per session<select name="minutes"><option value="10">10 minutes</option><option value="20" selected>20 minutes</option><option value="30">30 minutes</option></select></label>
      </div>
      <label>Long-term outcome <small>(optional)</small><input name="objective" maxlength="110" placeholder="e.g. Order a meal in Spanish"></label>
      <details class="name-option">
        <summary>Choose my own island name</summary>
        <label>Island name<input name="title" maxlength="40" placeholder="Defaults to your skill or goal"></label>
      </details>
      <button class="primary" type="submit"><span id="create-island-label">Create my island</span> <span aria-hidden="true">↗</span></button>
    </form>
  </dialog>
</body>
</html>
