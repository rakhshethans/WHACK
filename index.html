<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eef0e9">
  <title>WorldHopper | Your archipelago</title>
  <link rel="stylesheet" href="./src/styles.css">
  <link rel="stylesheet" href="./src/social/social.css">
  <script type="module" src="./src/app.mjs"></script>
</head>
<body>
  <div class="page-wave" aria-hidden="true">
    <svg viewBox="0 0 1440 900" preserveAspectRatio="none" focusable="false">
      <defs>
        <linearGradient id="page-wave-light" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
          <stop stop-color="#dbeafb"/>
          <stop offset=".62" stop-color="#c4e2fb"/>
          <stop offset="1" stop-color="#ecf6ff"/>
        </linearGradient>
        <linearGradient id="page-wave-mist" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
          <stop stop-color="#f7fbff"/>
          <stop offset="1" stop-color="#d4eaff"/>
        </linearGradient>
      </defs>
      <path class="page-wave-swell" d="M-90-90H1530V405C1290 520 1110 486 891 333S452 67 191 165-90 199-90 199Z" fill="url(#page-wave-light)"/>
      <path class="page-wave-foam" d="M-90 36C220-29 433 62 641 170S1109 421 1530 230V388C1162 518 906 336 701 246S259 27-90 153Z" fill="url(#page-wave-mist)" opacity=".76"/>
      <path class="page-wave-swell" d="M-90 624C232 459 436 639 713 709S1229 708 1530 554V990H-90Z" fill="url(#page-wave-light)" opacity=".72"/>
    </svg>
  </div>
  <header class="masthead">
    <a class="brand" href="./" aria-label="WorldHopper">
      <span class="masthead-icon map-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" focusable="false">
          <path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3zM9 3v15m6-12v15"/>
        </svg>
      </span>
      <span class="brand-wordmark">WORLDHOPPER</span>
    </a>
    <nav aria-label="Main navigation">
      <button id="world-tab" type="button" aria-pressed="true">My world</button>
      <button id="explore-tab" type="button" aria-pressed="false">Explore</button>
    </nav>
    <a class="masthead-icon user-icon" href="./sign-in.html" aria-label="Sign in or manage your account">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" focusable="false">
        <circle cx="12" cy="8" r="3.2"/>
        <path d="M5.5 19v-1a6.5 6.5 0 0 1 13 0v1"/>
      </svg>
    </a>
  </header>
  <main id="app"></main>
  <p class="sr-only" id="announcement" role="status"></p>
  <dialog id="onboarding" aria-labelledby="onboarding-title">
    <form id="island-form">
      <div class="dialog-top"><span class="eyebrow">EXPEDITION LOG / 01</span><button type="button" class="icon" id="close-dialog" aria-label="Close">×</button></div>
      <h2 id="onboarding-title">Chart a new island</h2>
      <label class="topic-label">What do you want to learn or achieve?
        <input name="topic" required autofocus maxlength="70" aria-describedby="plan-message" placeholder="e.g. Learn Spanish for travel">
      </label>
      <label>Experience<select name="experience"><option value="beginner">New to it</option><option value="intermediate">Some experience</option><option value="advanced">Confident</option></select></label>
      <label>Long-term outcome <small>(optional)</small><input name="objective" maxlength="110" placeholder="e.g. Order a meal in Spanish"></label>
      <details class="name-option">
        <summary>Choose my own island name</summary>
        <label>Island name<input name="title" maxlength="40" placeholder="Defaults to your skill or goal"></label>
      </details>
      <p id="plan-message" class="plan-message" role="status"></p>
      <button class="primary" type="submit"><span id="create-island-label">Create my island</span> <span aria-hidden="true">↗</span></button>
    </form>
  </dialog>
</body>
</html>
